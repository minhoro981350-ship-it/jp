<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>일본어 시험 마스터</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:sans-serif;background:#f4f7f6;color:#333;margin:0;padding:10px}
h1{font-size:1.2rem;text-align:center;color:#2c3e50;margin:5px 0 12px}
.tab-nav{display:flex;gap:3px;margin-bottom:10px}
.tab-nav button{flex:1;padding:10px 2px;background:#4A90E2;color:#fff;font-weight:bold;font-size:.78rem;border:none;border-radius:6px;cursor:pointer;line-height:1.2}
.tab-nav button.active{background:#2C3E50}
.tab-content{display:none;background:#fff;padding:15px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.tab-content.active{display:block}
.card{border:1px solid #e0e0e0;padding:10px;border-radius:6px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.group-tag{background:#e1f5fe;color:#0288d1;padding:2px 5px;border-radius:4px;font-size:.75rem;font-weight:bold}
.group-tag.exc{background:#ffebee;color:#c62828}
.conj-row{font-size:.78rem;color:#555;margin-top:5px;background:#f8f9fa;padding:4px 6px;border-radius:4px;line-height:1.4}
.conj-row b{color:#2c3e50}
.star-btn{background:none;border:none;font-size:1.5rem;color:#ccc;cursor:pointer;padding:0 5px}
.star-btn.starred{color:#f1c40f}
.filter-box{background:#f8f9fa;padding:8px 10px;border-radius:6px;border:1px solid #ddd;margin-bottom:10px;font-size:.85rem;font-weight:bold;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
select.mode-select{padding:5px 8px;border-radius:5px;border:1px solid #ccc;font-size:.82rem;font-weight:bold;color:#2c3e50;background:#fff}
.mode-switch{display:flex;gap:5px;margin-bottom:12px;background:#eef2f5;padding:4px;border-radius:8px}
.mode-switch button{flex:1;padding:8px;border:none;border-radius:6px;font-weight:bold;font-size:.85rem;background:transparent;color:#555;cursor:pointer}
.mode-switch button.active{background:#fff;color:#2c3e50;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.canvas-container{width:100%;display:flex;justify-content:center;margin:10px 0}
canvas{border:2px dashed #999;background:#fff;border-radius:8px;touch-action:none}
.btn{width:100%;padding:12px;border:none;border-radius:6px;background:#4A90E2;color:#fff;font-weight:bold;font-size:1rem;margin-top:8px;cursor:pointer}
.btn-sub{background:#7f8c8d}
.btn-ans{background:#27ae60}
.btn-next{background:#34495e;margin-top:14px}
.quiz-badge{display:inline-block;background:#2c3e50;color:#fff;font-size:.78rem;padding:3px 8px;border-radius:12px;margin-bottom:8px}
.quiz-prompt{font-size:1.18rem;font-weight:bold;margin-bottom:12px;color:#2c3e50;line-height:1.45;white-space:pre-line}
.hint-text{font-size:.82rem;color:#666;margin-bottom:8px}
.typing-input{width:100%;padding:12px;font-size:1.1rem;border:2px solid #4A90E2;border-radius:6px;text-align:center;font-weight:bold;outline:none}
.typing-input:focus{border-color:#2c3e50}
.feedback-box{margin-top:10px;padding:10px;border-radius:6px;font-weight:bold;text-align:center;font-size:.95rem;line-height:1.45;display:none}
.feedback-ok{background:#e8f5e9;color:#2e7d32;border:1px solid #a5d6a7}
.feedback-no{background:#ffebee;color:#c62828;border:1px solid #ef9a9a}
.exc-ref-box{background:#fff8e1;border:1px solid #ffe082;border-radius:6px;padding:8px 10px;font-size:.82rem;margin-bottom:10px;line-height:1.5}
</style>
</head>
<body>
<h1>📚 일본어 시험 단어장</h1>
<div class="tab-nav">
  <button id="btn-t1" class="active" onclick="goTab('t1')">📖 단어</button>
  <button id="btn-t2" onclick="goTab('t2')">🧠 개념연습</button>
  <button id="btn-t3" onclick="goTab('t3')">✍️ 활용퀴즈</button>
  <button id="btn-t4" onclick="goTab('t4')">🀄 예외암기</button>
  <button id="btn-t5" onclick="goTab('t5')">📝 쓰기</button>
</div>

<div id="t1" class="tab-content active">
  <div class="filter-box">
    <span><input type="checkbox" id="starOnly" onchange="renderWordList()"> <label for="starOnly">⭐ 헷갈리는 단어만 보기</label></span>
    <span style="font-size:.8rem;color:#666">(총 <b id="wordCount">0</b>개)</span>
  </div>
  <div id="wordList"></div>
</div>

<div id="t2" class="tab-content">
  <div class="mode-switch">
    <button id="cMode-choice" class="active" onclick="setConceptMode('choice')">🔘 4지선다 고르기</button>
    <button id="cMode-type" onclick="setConceptMode('type')">⌨️ 직접 타자 입력</button>
  </div>
  <div class="filter-box">
    <span>연습 범위:</span>
    <select id="conceptFilter" class="mode-select" onchange="nextConcept()">
      <option value="all">전체 문법 규칙</option>
      <option value="te">て형 변환 규칙만</option>
      <option value="nai">ない형 변환 규칙만</option>
      <option value="masu">ます형 변환 규칙만</option>
    </select>
  </div>
  <div id="conceptBadge" class="quiz-badge"></div>
  <div id="conceptQ" class="quiz-prompt"></div>
  <div id="conceptChoiceBox"></div>
  <div id="conceptTypeBox" style="display:none">
    <div class="hint-text">일본어 키보드로 정답 어미나 형태를 입력하세요 (예: って, かない)</div>
    <input type="text" id="conceptInput" class="typing-input" placeholder="여기에 입력..." onkeydown="if(event.key==='Enter')checkConceptTyping()">
    <button class="btn btn-ans" onclick="checkConceptTyping()">정답 확인</button>
  </div>
  <div id="conceptFeedback" class="feedback-box"></div>
  <button class="btn btn-next" onclick="nextConcept()">다음 개념 문제 ➔</button>
</div>

<div id="t3" class="tab-content">
  <div class="mode-switch">
    <button id="qMode-choice" class="active" onclick="setQuizInputMode('choice')">🔘 4지선다 고르기</button>
    <button id="qMode-type" onclick="setQuizInputMode('type')">⌨️ 직접 타자 입력</button>
  </div>
  <div class="filter-box">
    <span><input type="checkbox" id="quizStarOnly" onchange="nextQuiz()"> <label for="quizStarOnly">⭐ 별표만</label></span>
    <select id="quizFormFilter" class="mode-select" onchange="nextQuiz()">
      <option value="all">🎲 ます·て·ない 랜덤</option>
      <option value="te">て형 (테형) 집중</option>
      <option value="nai">ない형 (나이형) 집중</option>
      <option value="masu">ます형 (마스형) 집중</option>
    </select>
  </div>
  <div id="quizBadge" class="quiz-badge"></div>
  <div id="quizQ" class="quiz-prompt"></div>
  <div id="quizOpts"></div>
  <div id="quizTypeBox" style="display:none">
    <div class="hint-text">한자 포함 또는 히라가나 전체 입력 모두 정답 인정됩니다.</div>
    <input type="text" id="quizInput" class="typing-input" placeholder="활용형을 직접 입력하세요..." onkeydown="if(event.key==='Enter')checkQuizTyping()">
    <button class="btn btn-ans" onclick="checkQuizTyping()">정답 확인</button>
  </div>
  <div id="quizFeedback" class="feedback-box"></div>
  <button class="btn btn-next" onclick="nextQuiz()">다음 동사 문제 ➔</button>
</div>

<div id="t4" class="tab-content">
  <div class="exc-ref-box">
    <b>📌 1류 예외 동사 6총사 (끝이 る지만 1류 변화):</b><br>
    知る(알다) · 入る(들어가다) · 切る(자르다) · 帰る(돌아가다) · 走る(달리다) · 要る(필요하다)
  </div>
  <div class="mode-switch">
    <button id="eMode-choice" class="active" onclick="setExcMode('choice')">🔘 한자·뜻 고르기</button>
    <button id="eMode-draw" onclick="setExcMode('draw')">🖌️ 한자 직접 그리기</button>
  </div>
  <div id="excChoiceArea">
    <div id="excBadge" class="quiz-badge"></div>
    <div id="excQ" class="quiz-prompt"></div>
    <div id="excOpts"></div>
    <div id="excFeedback" class="feedback-box"></div>
    <button class="btn btn-next" onclick="nextExcQuiz()">다음 예외 문제 ➔</button>
  </div>
  <div id="excDrawArea" style="display:none">
    <div id="excDrawPrompt" style="font-size:1.15rem;font-weight:bold;text-align:center;margin-bottom:6px;color:#2c3e50"></div>
    <div class="canvas-container"><canvas id="excPaint" width="260" height="260"></canvas></div>
    <button class="btn btn-sub" onclick="clearExcBoard()">지우기</button>
    <button class="btn btn-ans" onclick="toggleExcAns()">정답 한자 확인</button>
    <div id="excAnsText" style="display:none;text-align:center;font-size:1.35rem;font-weight:bold;margin-top:10px;color:#c62828;line-height:1.5"></div>
    <button class="btn btn-next" onclick="nextExcDraw()">다음 한자 그리기 ➔</button>
  </div>
</div>

<div id="t5" class="tab-content">
  <div class="filter-box">
    <span><input type="checkbox" id="dictStarOnly" onchange="nextDict()"> <label for="dictStarOnly">⭐ 헷갈리는 단어만 출제</label></span>
  </div>
  <div id="qMeaning" style="font-size:1.2rem;font-weight:bold;text-align:center;margin-bottom:5px"></div>
  <div class="canvas-container"><canvas id="paint" width="260" height="260"></canvas></div>
  <button class="btn btn-sub" onclick="clearBoard()">지우기</button>
  <button class="btn btn-ans" onclick="showAnswer()">정답 확인</button>
  <div id="ansText" style="display:none;text-align:center;font-size:1.05rem;font-weight:bold;margin-top:10px;color:#2c3e50;line-height:1.5"></div>
  <button class="btn btn-next" onclick="nextDict()">다음 문제 ➔</button>
</div>

  {cat:'te',badge:'て형 규칙 (2류)',q:'2류 동사의 て형 만드는 공식은?',ans:'る를 떼고 て',fakes:['る를 떼고 って','る를 り로 바꾸고 て','る를 떼고 んで'],desc:'2류 동사는 무조건 어미 る를 탈락시키고「て」를 붙입니다 (食べる→食べて)'},
  {cat:'te',badge:'て형 규칙 (3류)',q:'3류 동사「来る(くる)」의 て형 발음과 표기는?',ans:'来て(きて)',fakes:['来て(くて)','来て(こて)','来って(きって)'],desc:'来る는 て형에서「来て(きて)」로 읽습니다.'},
  {cat:'te',badge:'て형 규칙 (3류)',q:'3류 동사「する(하다)」의 て형은?',ans:'して',fakes:['すて','しって','しんで'],desc:'する ➔ して'},
  {cat:'nai',badge:'ない형 규칙 (1류)',q:'1류 동사의 ない형 기본 만드는 법은? (う로 끝나는 동사 제외)',ans:'어미를 あ단으로 바꾸고 ない',fakes:['어미를 い단으로 바꾸고 ない','어미를 え단으로 바꾸고 ない','어미를 떼고 ない'],desc:'1류 동사는 う단 어미를 あ단으로 바꾼 뒤「ない」를 붙입니다 (書く→書かない)'},
  {cat:'nai',badge:'ない형 주의 (1류)',q:'어미가「う」로 끝나는 1류 동사(言う, 買う 등)의 ない형 어미 변화는?',ans:'わない',fakes:['あない','いない','ったない'],desc:'う는 あ가 아니라「わ」로 바뀝니다! (言う→言わない, 使う→使わない)'},
  {cat:'nai',badge:'ない형 예외 (1류)',q:'1류 동사「ある(있다)」의 ない형은 무엇일까요?',ans:'ない',fakes:['あらない','あわない','いない'],desc:'ある의 부정형은 あらない가 아니라 그냥「ない」입니다!'},
  {cat:'nai',badge:'ない형 규칙 (2류)',q:'2류 동사의 ない형 만드는 공식은?',ans:'る를 떼고 ない',fakes:['る를 らない로 변경','る를 わない로 변경','る를 れない로 변경'],desc:'2류 동사는 る만 떼고「ない」를 붙입니다 (見る→見ない, 食べる→食べない)'},
  {cat:'nai',badge:'ない형 규칙 (3류)',q:'3류 동사「来る(くる)」의 ない형 발음과 표기는?',ans:'来ない(こない)',fakes:['来ない(きない)','来ない(くない)','来らない(こらない)'],desc:'来る는 ない형에서「来ない(こない)」로 읽습니다!'},
  {cat:'nai',badge:'ない형 규칙 (3류)',q:'3류 동사「する(하다)」의 ない형은?',ans:'しない',fakes:['すない','さない','せない'],desc:'する ➔ しない'},
  {cat:'masu',badge:'ます형 규칙 (1류)',q:'1류 동사의 ます형 만드는 기본 공식은?',ans:'어미를 い단으로 바꾸고 ます',fakes:['어미를 あ단으로 바꾸고 ます','어미를 え단으로 바꾸고 ます','어미를 떼고 ます'],desc:'1류 동사는 う단 어미를 い단으로 바꾼 뒤「ます」를 붙입니다 (飲む→飲みます)'},
  {cat:'masu',badge:'ます형 규칙 (2류)',q:'2류 동사의 ます형 만드는 공식은?',ans:'る를 떼고 ます',fakes:['る를 ります로 변경','る를 れます로 변경','る를 います로 변경'],desc:'2류 동사는 る를 탈락시키고「ます」를 붙입니다 (起きる→起きます)'},
  {cat:'masu',badge:'ます형 규칙 (3류)',q:'3류 동사「来る(くる)」의 ます형 발음과 표기는?',ans:'来ます(きます)',fakes:['来ます(くます)','来ます(こます)','来ります(きります)'],desc:'来る는 ます형에서「来ます(きます)」로 읽습니다.'}
];

const STORAGE_KEY = 'jp_quiz_v4_stars';
let words = defaultWords;
try {
  const savedStars = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  words = defaultWords.map(w => ({ ...w, starred: !!savedStars[w.id] }));
} catch(e) { words = defaultWords; }

function saveStars() {
  try {
    const map = {};
    words.forEach(w => { if (w.starred) map[w.id] = true; });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(map));
  } catch(e) {}
}

let curConcept = null, curQuiz = null, curQuizForm = 'te', curExcQuiz = null, curExcDraw = null, curDict = null;
let cv, ctx, drawing = false, excCv, excCtx, excDrawing = false;

function goTab(tabId) {
  document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
  document.querySelectorAll('.tab-nav button').forEach(e => e.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  document.getElementById('btn-' + tabId).classList.add('active');
}

function renderWordList() {
  const listEl = document.getElementById('wordList');
  const starOnly = document.getElementById('starOnly').checked;
  const filtered = starOnly ? words.filter(w => w.starred) : words;
  document.getElementById('wordCount').innerText = filtered.length;
  if (!filtered.length) {
    listEl.innerHTML = '<div style="text-align:center;color:#888;padding:20px">⭐ 마크 표시된 단어가 없습니다.</div>';
    return;
  }
  listEl.innerHTML = filtered.map(w => `
    <div class="card">
      <div style="flex:1">
        <div><b>${w.kanji}</b> (${w.hira}) <span class="group-tag ${w.group.includes('예외')?'exc':''}">${w.group}</span> - ${w.mean}</div>
        <div class="conj-row">ます: <b>${w.masu}</b> · て: <b>${w.te}</b> · ない: <b>${w.nai}</b></div>
      </div>
      <button class="star-btn ${w.starred?'starred':''}" onclick="toggleStar(${w.id})">★</button>
    </div>
  `).join('');
}

function toggleStar(id) {
  const w = words.find(x => x.id === id);
  if (w) { w.starred = !w.starred; saveStars(); renderWordList(); }
}

function setConceptMode(m) {
  document.getElementById('cMode-choice').classList.toggle('active', m === 'choice');
  document.getElementById('cMode-type').classList.toggle('active', m === 'type');
  document.getElementById('conceptChoiceBox').style.display = m === 'choice' ? 'block' : 'none';
  document.getElementById('conceptTypeBox').style.display = m === 'type' ? 'block' : 'none';
  document.getElementById('conceptFeedback').style.display = 'none';
}

function nextConcept() {
  const f = document.getElementById('conceptFilter').value;
  const pool = f === 'all' ? conceptRules : conceptRules.filter(r => r.cat === f);
  curConcept = pool[Math.floor(Math.random() * pool.length)];
  document.getElementById('conceptBadge').innerText = curConcept.badge;
  document.getElementById('conceptQ').innerText = curConcept.q;
  document.getElementById('conceptFeedback').style.display = 'none';
  document.getElementById('conceptInput').value = '';
  const box = document.getElementById('conceptChoiceBox');
  box.innerHTML = '';
  [curConcept.ans, ...curConcept.fakes].sort(() => Math.random() - 0.5).forEach(c => {
    const b = document.createElement('button');
    b.className = 'btn'; b.style.margin = '4px 0'; b.innerText = c;
    b.onclick = () => showConceptResult(c === curConcept.ans);
    box.appendChild(b);
  });
}

function checkConceptTyping() {
  const val = document.getElementById('conceptInput').value.trim().replace(/\s+/g, '');
  if (!val) return;
  const cleanAns = curConcept.ans.replace(/\(.*?\)/g, '').replace(/\s+/g, '');
  showConceptResult(val === curConcept.ans.replace(/\s+/g, '') || val === cleanAns);
}

function showConceptResult(isOk) {
  const fb = document.getElementById('conceptFeedback');
  fb.style.display = 'block';
  fb.className = 'feedback-box ' + (isOk ? 'feedback-ok' : 'feedback-no');
  fb.innerHTML = (isOk ? '⭕ 정답입니다!' : `❌ 오답! 정답: ${curConcept.ans}`) + `<br><span style="font-weight:normal;font-size:.85rem">${curConcept.desc}</span>`;
}

function setQuizInputMode(m) {
  document.getElementById('qMode-choice').classList.toggle('active', m === 'choice');
  document.getElementById('qMode-type').classList.toggle('active', m === 'type');
  document.getElementById('quizOpts').style.display = m === 'choice' ? 'block' : 'none';
  document.getElementById('quizTypeBox').style.display = m === 'type' ? 'block' : 'none';
  document.getElementById('quizFeedback').style.display = 'none';
}

function makeSameFormFakes(w, formType) {
  const stem = w.kanji.slice(0, -1);
  const fakes = new Set();
  if (formType === 'te') {
    fakes.add(stem + 'て'); fakes.add(stem + 'って'); fakes.add(stem + 'いて'); fakes.add(stem + 'んで'); fakes.add(stem + 'いで'); fakes.add(stem + 'して');
  } else if (formType === 'nai') {
    fakes.add(stem + 'ない'); fakes.add(stem + 'あない'); fakes.add(stem + 'らない'); fakes.add(stem + 'わない'); fakes.add(stem + 'いない'); fakes.add(w.kanji + 'ない');
    if (w.kanji === 'ある') { fakes.add('あらない'); fakes.add('あわない'); fakes.add('いない'); }
  } else {
    fakes.add(stem + 'ます'); fakes.add(stem + 'ります'); fakes.add(stem + 'います'); fakes.add(stem + 'えます'); fakes.add(w.kanji + 'ます');
  }
  fakes.delete(w[formType]);
  fakes.delete(w[formType + 'H']);
  return Array.from(fakes).slice(0, 3);
}

function nextQuiz() {
  const starOnly = document.getElementById('quizStarOnly').checked;
  const f = document.getElementById('quizFormFilter').value;
  const pool = starOnly ? words.filter(w => w.starred) : words;
  if (!pool.length) {
    alert('⭐ 마크 표시한 단어가 없습니다!');
    document.getElementById('quizStarOnly').checked = false;
    nextQuiz(); return;
  }
  curQuiz = pool[Math.floor(Math.random() * pool.length)];
  const forms = ['te', 'nai', 'masu'];
  curQuizForm = f === 'all' ? forms[Math.floor(Math.random() * 3)] : f;
  const names = { te: 'て형 (테형)', nai: 'ない형 (나이형)', masu: 'ます형 (마스형)' };
  document.getElementById('quizBadge').innerText = `${names[curQuizForm]} 맞추기`;
  document.getElementById('quizQ').innerText = `${curQuiz.kanji} (${curQuiz.hira}) - ${curQuiz.mean}\n👉 올바른 ${names[curQuizForm]}은?`;
  document.getElementById('quizFeedback').style.display = 'none';
  document.getElementById('quizInput').value = '';
  const opts = document.getElementById('quizOpts');
  opts.innerHTML = '';
  const target = curQuiz[curQuizForm];
  [target, ...makeSameFormFakes(curQuiz, curQuizForm)].sort(() => Math.random() - 0.5).forEach(c => {
    const b = document.createElement('button');
    b.className = 'btn'; b.style.margin = '4px 0'; b.innerText = c;
    b.onclick = () => showQuizResult(c === target);
    opts.appendChild(b);
  });
}

function checkQuizTyping() {
  const val = document.getElementById('quizInput').value.trim().replace(/\s+/g, '');
  if (!val) return;
  showQuizResult(val === curQuiz[curQuizForm] || val === curQuiz[curQuizForm + 'H']);
}

function showQuizResult(isOk) {
  const ans = curQuiz[curQuizForm], ansH = curQuiz[curQuizForm + 'H'];
  const disp = ans === ansH ? ans : `${ans} (${ansH})`;
  const fb = document.getElementById('quizFeedback');
  fb.style.display = 'block';
  fb.className = 'feedback-box ' + (isOk ? 'feedback-ok' : 'feedback-no');
  fb.innerHTML = (isOk ? `⭕ 정답입니다! 「${disp}」` : `❌ 오답! 정답은 「${disp}」`) +
    `<br><span style="font-weight:normal;font-size:.84rem">[${curQuiz.group}] ます: ${curQuiz.masu} / て: ${curQuiz.te} / ない: ${curQuiz.nai}</span>`;
}

const excWords = words.filter(w => w.group === '1류(예외)');
const excPool = words.filter(w => ['知る','入る','切る','帰る','走る','要る','着る','いる'].includes(w.kanji));

function setExcMode(m) {
  document.getElementById('eMode-choice').classList.toggle('active', m === 'choice');
  document.getElementById('eMode-draw').classList.toggle('active', m === 'draw');
  document.getElementById('excChoiceArea').style.display = m === 'choice' ? 'block' : 'none';
  document.getElementById('excDrawArea').style.display = m === 'draw' ? 'block' : 'none';
}

function nextExcQuiz() {
  curExcQuiz = excWords[Math.floor(Math.random() * excWords.length)];
  const opts = document.getElementById('excOpts');
  opts.innerHTML = '';
  document.getElementById('excFeedback').style.display = 'none';
  if (Math.random() < 0.5) {
    document.getElementById('excBadge').innerText = '1류 예외 한자 고르기';
    document.getElementById('excQ').innerText = `뜻:「${curExcQuiz.mean}」 (${curExcQuiz.hira})\n알맞은 한자 표기는?`;
    const target = curExcQuiz.kanji, choices = [target];
    while (choices.length < 4) {
      const r = excPool[Math.floor(Math.random() * excPool.length)].kanji;
      if (!choices.includes(r)) choices.push(r);
    }
    choices.sort(() => Math.random() - 0.5).forEach(c => {
      const b = document.createElement('button');
      b.className = 'btn'; b.style.margin = '4px 0'; b.innerText = c;
      b.onclick = () => showExcResult(c === target, target);
      opts.appendChild(b);
    });
  } else {
    document.getElementById('excBadge').innerText = '1류 예외 뜻 & 활용 고르기';
    document.getElementById('excQ').innerText = `한자「${curExcQuiz.kanji}」의 뜻과 て형은?`;
    const target = `${curExcQuiz.mean} / ${curExcQuiz.te}`, choices = [target];
    while (choices.length < 4) {
      const r = excPool[Math.floor(Math.random() * excPool.length)];
      const lbl = `${r.mean} / ${r.te}`;
      if (!choices.includes(lbl)) choices.push(lbl);
    }
    choices.sort(() => Math.random() - 0.5).forEach(c => {
      const b = document.createElement('button');
      b.className = 'btn'; b.style.margin = '4px 0'; b.innerText = c;
      b.onclick = () => showExcResult(c === target, target);
      opts.appendChild(b);
    });
  }
}

function showExcResult(isOk, target) {
  const fb = document.getElementById('excFeedback');
  fb.style.display = 'block';
  fb.className = 'feedback-box ' + (isOk ? 'feedback-ok' : 'feedback-no');
  fb.innerHTML = (isOk ? '⭕ 정답입니다!' : `❌ 오답! 정답: ${target}`) +
    `<br><span style="font-weight:normal;font-size:.85rem">${curExcQuiz.kanji}(${curExcQuiz.hira}) [1류 예외] ➔ ます: ${curExcQuiz.masu} / て: ${curExcQuiz.te} / ない: ${curExcQuiz.nai}</span>`;
}

function nextExcDraw() {
  curExcDraw = excWords[Math.floor(Math.random() * excWords.length)];
  document.getElementById('excDrawPrompt').innerText = `뜻: ${curExcDraw.mean} (${curExcDraw.hira}) — 한자를 써보세요!`;
  clearExcBoard();
  document.getElementById('excAnsText').innerHTML = `${curExcDraw.kanji} (${curExcDraw.hira})<br><span style="font-size:.9rem;color:#333">ます: ${curExcDraw.masu} · て: ${curExcDraw.te} · ない: ${curExcDraw.nai}</span>`;
}
function clearExcBoard() { if (excCtx) excCtx.clearRect(0, 0, excCv.width, excCv.height); document.getElementById('excAnsText').style.display = 'none'; }
function toggleExcAns() { const e = document.getElementById('excAnsText'); e.style.display = e.style.display === 'none' ? 'block' : 'none'; }

function clearBoard() { if (ctx) ctx.clearRect(0, 0, cv.width, cv.height); document.getElementById('ansText').style.display = 'none'; }
function showAnswer() { const a = document.getElementById('ansText'); a.style.display = a.style.display === 'none' ? 'block' : 'none'; }
function nextDict() {
  const starOnly = document.getElementById('dictStarOnly').checked;
  const pool = starOnly ? words.filter(w => w.starred) : words;
  if (!pool.length) {
    alert('⭐ 마크 표시한 단어가 없습니다!');
    document.getElementById('dictStarOnly').checked = false;
    nextDict(); return;
  }
  curDict = pool[Math.floor(Math.random() * pool.length)];
  document.getElementById('qMeaning').innerText = `뜻: ${curDict.mean}`;
  clearBoard();
  document.getElementById('ansText').innerHTML = `기본형: ${curDict.kanji} (${curDict.hira}) [${curDict.group}]<br><span style="font-size:.9rem;color:#555">ます: ${curDict.masu} / て: ${curDict.te} / ない: ${curDict.nai}</span>`;
}

function bindCanvas(el, c, getF, setF) {
  const pos = e => {
    const r = el.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  };
  el.addEventListener('touchstart', e => { e.preventDefault(); setF(true); const p = pos(e); c.beginPath(); c.moveTo(p.x, p.y); }, {passive:false});
  el.addEventListener('touchmove', e => { e.preventDefault(); if (!getF()) return; const p = pos(e); c.lineTo(p.x, p.y); c.stroke(); }, {passive:false});
  el.addEventListener('touchend', () => setF(false));
  el.addEventListener('mousedown', e => { setF(true); const p = pos(e); c.beginPath(); c.moveTo(p.x, p.y); });
  el.addEventListener('mousemove', e => { if (!getF()) return; const p = pos(e); c.lineTo(p.x, p.y); c.stroke(); });
  el.addEventListener('mouseup', () => setF(false));
}

function initApp() {
  renderWordList();
  cv = document.getElementById('paint');
  if (cv) { ctx = cv.getContext('2d'); ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.strokeStyle = '#2c3e50'; bindCanvas(cv, ctx, () => drawing, v => drawing = v); }
  excCv = document.getElementById('excPaint');
  if (excCv) { excCtx = excCv.getContext('2d'); excCtx.lineWidth = 5; excCtx.lineCap = 'round'; excCtx.strokeStyle = '#c62828'; bindCanvas(excCv, excCtx, () => excDrawing, v => excDrawing = v); }
  nextConcept(); nextQuiz(); nextExcQuiz(); nextExcDraw(); nextDict();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initApp);
else initApp();
</script>
